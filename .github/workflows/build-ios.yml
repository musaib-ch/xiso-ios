name: Build iOS (unsigned IPA)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Fetch engines (libxiso + iso2god-rs)
        run: |
          git clone --depth 1 https://github.com/Razenko/extract-xiso-gui.git upstream-xiso
          git clone https://github.com/iliazeus/iso2god-rs.git upstream-god
          git -C upstream-god checkout 76207d7d7f89f551c7a5769560c0073e9ffe50e9
          mkdir -p Sources/CXiso
          cp upstream-xiso/src/libxiso.c upstream-xiso/src/libxiso.h upstream-xiso/src/xiso_internal.h Sources/CXiso/
          cp upstream-xiso/LICENSE.TXT LICENSE-extract-xiso.TXT
      - name: Write app files
        run: |
          cat > project.yml <<'XISO_EOF'
          name: XisoGUI
          options:
            bundleIdPrefix: dev.xiso
            deploymentTarget:
              iOS: "16.0"
          targets:
            XisoGUI:
              type: application
              platform: iOS
              sources:
                - path: Sources/XisoApp.swift
                - path: Sources/XisoEngine.swift
                - path: Sources/StudioDashboard.swift
                - path: Sources/CXiso
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.xiso.gui
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.9"
                  SWIFT_OBJC_BRIDGING_HEADER: Sources/CXiso/XisoBridge.h
                  HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/CXiso"
                  LIBRARY_SEARCH_PATHS: "$(SRCROOT)/godffi/target/aarch64-apple-ios/release"
                  OTHER_LDFLAGS: "-lxisogod"
                  GCC_C_LANGUAGE_STANDARD: gnu11
                  GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) __DARWIN__=1 _FILE_OFFSET_BITS=64"
                  GCC_WARN_INHIBIT_ALL_WARNINGS: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGN_IDENTITY: ""
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "XISO GUI"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
          XISO_EOF
          mkdir -p Sources
          cat > Sources/XisoEngine.swift <<'XISO_EOF'
          import Foundation
          import SwiftUI

          struct XisoNode: Identifiable {
              let id = UUID()
              let name: String
              let size: UInt32
              let isDir: Bool
              var children: [XisoNode]?
          }

          private let progressCB: @convention(c) (Int64, Int64, UnsafeMutableRawPointer?) -> Void = { cur, total, ud in
              guard let ud = ud else { return }
              Unmanaged<XisoEngine>.fromOpaque(ud).takeUnretainedValue().onProgress(cur, total)
          }

          private let logCB: @convention(c) (UnsafePointer<CChar>?, Int32, UnsafeMutableRawPointer?) -> Void = { msg, err, ud in
              guard let ud = ud, let msg = msg else { return }
              Unmanaged<XisoEngine>.fromOpaque(ud).takeUnretainedValue().onLog(String(cString: msg), err != 0)
          }

          private let godLogCB: @convention(c) (UnsafePointer<CChar>?, UnsafeMutableRawPointer?) -> Void = { msg, ud in
              guard let ud = ud, let msg = msg else { return }
              Unmanaged<XisoEngine>.fromOpaque(ud).takeUnretainedValue().onLog(String(cString: msg), false)
          }

          private let godProgressCB: @convention(c) (UInt64, UInt64, UnsafeMutableRawPointer?) -> Void = { cur, total, ud in
              guard let ud = ud else { return }
              Unmanaged<XisoEngine>.fromOpaque(ud).takeUnretainedValue().onProgress(Int64(cur), Int64(total))
          }

          /// libxiso uses chdir() internally (process-wide), so operations are strictly serialized.
          final class XisoEngine: ObservableObject {
              @Published var busy = false
              @Published var progress: Double = 0
              @Published var status = "Idle"
              @Published var log: [String] = []
              @Published var tree: [XisoNode] = []

              private let queue = DispatchQueue(label: "xiso.engine")
              private var ctx: OpaquePointer?
              private var lastTick = Date.distantPast

              fileprivate func onProgress(_ cur: Int64, _ total: Int64) {
                  let now = Date()
                  guard now.timeIntervalSince(lastTick) > 0.1 else { return }
                  lastTick = now
                  let p = total > 0 ? Double(cur) / Double(total) : 0
                  DispatchQueue.main.async { self.progress = min(max(p, 0), 1) }
              }

              fileprivate func onLog(_ line: String, _ isError: Bool) {
                  let text = (isError ? "ERROR: " : "") + line.trimmingCharacters(in: .whitespacesAndNewlines)
                  DispatchQueue.main.async {
                      self.log.append(text)
                      if self.log.count > 2000 { self.log.removeFirst(self.log.count - 2000) }
                  }
              }

              func cancel() { if let c = ctx { xiso_cancel(c) }; xgod_cancel() }

              private func run(_ title: String, scoped: [URL], _ work: @escaping (OpaquePointer) -> Int32) {
                  guard !busy else { return }
                  busy = true; progress = 0; status = title + "…"; log = []
                  let accessed = scoped.filter { $0.startAccessingSecurityScopedResource() }
                  queue.async {
                      let c = xiso_context_create()!
                      self.ctx = c
                      let me = Unmanaged.passUnretained(self).toOpaque()
                      xiso_set_progress_callback(c, progressCB, me)
                      xiso_set_log_callback(c, logCB, me)
                      let rc = work(c)
                      let files = xiso_get_total_files(c)
                      let bytes = xiso_get_total_bytes(c)
                      self.ctx = nil
                      xiso_context_free(c)
                      accessed.forEach { $0.stopAccessingSecurityScopedResource() }
                      DispatchQueue.main.async {
                          self.busy = false
                          self.progress = rc == 0 ? 1 : self.progress
                          self.status = rc == 0
                              ? (files > 0
                                  ? "\(title) finished — \(files) files, \(ByteCountFormatter.string(fromByteCount: Int64(bytes), countStyle: .file))"
                                  : "\(title) finished")
                              : (rc == 2 ? "\(title) cancelled" : "\(title) failed (code \(rc)) — see log")
                      }
                  }
              }

              func extract(iso: URL, dest: URL, skipSystemUpdate: Bool) {
                  run("Extract", scoped: [iso, dest]) { c in
                      xiso_set_skip_systemupdate(c, skipSystemUpdate)
                      return iso.path.withCString { i in dest.path.withCString { d in xiso_extract(c, i, d) } }
                  }
              }

              func create(src: URL, outISO: URL, mediaEnable: Bool) {
                  run("Create", scoped: [src, outISO.deletingLastPathComponent()]) { c in
                      xiso_set_media_enable(c, mediaEnable)
                      return src.path.withCString { s in outISO.path.withCString { o in xiso_create(c, s, o) } }
                  }
              }

              func rewrite(iso: URL, dest: URL?, deleteOld: Bool) {
                  run("Rewrite", scoped: [iso] + (dest.map { [$0] } ?? [])) { c in
                      iso.path.withCString { i in
                          if let d = dest {
                              return d.path.withCString { dd in xiso_rewrite(c, i, dd, deleteOld) }
                          }
                          return xiso_rewrite(c, i, nil, deleteOld)
                      }
                  }
              }

              /// ISO -> Games on Demand package (Xbox 360 / Xbox), via iso2god-rs.
              func toGOD(iso: URL, dest: URL, trim: Bool) {
                  run("Convert to GOD", scoped: [iso, dest]) { _ in
                      let me = Unmanaged.passUnretained(self).toOpaque()
                      return iso.path.withCString { i in
                          dest.path.withCString { d in
                              xgod_convert(i, d, trim, 2, godLogCB, godProgressCB, me)
                          }
                      }
                  }
              }

              func list(iso: URL) {
                  run("List", scoped: [iso]) { c in
                      var root: UnsafeMutablePointer<xiso_file_node>? = nil
                      let rc = iso.path.withCString { xiso_list(c, $0, &root) }
                      let nodes = Self.build(root)
                      if root != nil { xiso_free_file_tree(root) }
                      DispatchQueue.main.async { self.tree = nodes }
                      return rc
                  }
              }

              private static func build(_ p: UnsafeMutablePointer<xiso_file_node>?) -> [XisoNode] {
                  var out: [XisoNode] = []
                  var cur = p
                  while let n = cur {
                      let v = n.pointee
                      out.append(XisoNode(
                          name: v.filename != nil ? String(cString: v.filename) : "?",
                          size: v.file_size,
                          isDir: v.is_directory,
                          children: v.is_directory ? build(v.subdir) : nil))
                      cur = v.next
                  }
                  return out
              }
          }
          XISO_EOF
          mkdir -p Sources
          cat > Sources/XisoApp.swift <<'XISO_EOF'
          import SwiftUI
          import UniformTypeIdentifiers

          @main
          struct XisoApp: App {
              @StateObject private var engine = XisoEngine()
              var body: some Scene {
                  WindowGroup { RootView().environmentObject(engine) }
              }
          }

          struct RootView: View {
              @EnvironmentObject var engine: XisoEngine
              var body: some View {
                  VStack(spacing: 0) {
                      TabView {
                          DashboardView().tabItem { Label("Home", systemImage: "opticaldisc") }
                          FilesLibraryView().tabItem { Label("Files", systemImage: "folder") }
                          ActivityLibraryView().tabItem { Label("Activity", systemImage: "list.bullet.rectangle") }
                          SettingsLibraryView().tabItem { Label("Settings", systemImage: "gearshape") }
                      }
                      StatusBar()
                  }
                  .tint(Color(red: 0.47, green: 0.87, blue: 0.40))
                  .preferredColorScheme(.dark)
              }
          }

          struct StatusBar: View {
              @EnvironmentObject var engine: XisoEngine
              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      ProgressView(value: engine.progress)
                      HStack {
                          Text(engine.status).font(.footnote).lineLimit(2)
                          Spacer()
                          if engine.busy { Button("Cancel", role: .destructive) { engine.cancel() }.font(.footnote) }
                      }
                      if !engine.log.isEmpty {
                          ScrollViewReader { proxy in
                              ScrollView {
                                  LazyVStack(alignment: .leading, spacing: 2) {
                                      ForEach(Array(engine.log.enumerated()), id: \.offset) { i, l in
                                          Text(l).font(.system(size: 11, design: .monospaced)).id(i)
                                      }
                                  }.frame(maxWidth: .infinity, alignment: .leading)
                              }
                              .frame(height: 90)
                              .onChange(of: engine.log.count) { n in proxy.scrollTo(n - 1, anchor: .bottom) }
                          }
                      }
                  }
                  .padding(10)
                  .background(.bar)
              }
          }

          struct PickRow: View {
              let label: String
              let types: [UTType]
              @Binding var url: URL?
              @State private var show = false
              var body: some View {
                  Button { show = true } label: {
                      HStack {
                          Text(label).foregroundStyle(.primary)
                          Spacer()
                          Text(url?.lastPathComponent ?? "Choose…").foregroundStyle(.secondary).lineLimit(1)
                      }
                  }
                  .fileImporter(isPresented: $show, allowedContentTypes: types) { r in
                      if case .success(let u) = r { url = u }
                  }
              }
          }

          struct ExtractView: View {
              @EnvironmentObject var engine: XisoEngine
              @State private var iso: URL?
              @State private var dest: URL?
              @State private var skip = false
              var body: some View {
                  NavigationStack {
                      Form {
                          PickRow(label: "ISO", types: [.data], url: $iso)
                          PickRow(label: "Destination", types: [.folder], url: $dest)
                          Toggle("Skip $SystemUpdate", isOn: $skip)
                          Text("Xbox 360 discs: the extracted folder contains default.xex — open that in Xenia.")
                              .font(.footnote).foregroundStyle(.secondary)
                          Button("Extract") { if let i = iso, let d = dest { engine.extract(iso: i, dest: d, skipSystemUpdate: skip) } }
                              .disabled(iso == nil || dest == nil || engine.busy)
                      }.navigationTitle("Extract")
                  }
              }
          }

          struct CreateView: View {
              @EnvironmentObject var engine: XisoEngine
              @State private var src: URL?
              @State private var outDir: URL?
              @State private var name = "game.iso"
              @State private var media = true
              var body: some View {
                  NavigationStack {
                      Form {
                          PickRow(label: "Source folder", types: [.folder], url: $src)
                          PickRow(label: "Output folder", types: [.folder], url: $outDir)
                          TextField("Output name", text: $name).autocorrectionDisabled().textInputAutocapitalization(.never)
                          Toggle("Media-enable patch", isOn: $media)
                          Button("Create") {
                              if let s = src, let o = outDir { engine.create(src: s, outISO: o.appendingPathComponent(name), mediaEnable: media) }
                          }.disabled(src == nil || outDir == nil || name.isEmpty || engine.busy)
                      }.navigationTitle("Create")
                  }
              }
          }

          struct ListView: View {
              @EnvironmentObject var engine: XisoEngine
              @State private var iso: URL?
              var body: some View {
                  NavigationStack {
                      VStack {
                          Form {
                              PickRow(label: "ISO", types: [.data], url: $iso)
                              Button("List contents") { if let i = iso { engine.list(iso: i) } }
                                  .disabled(iso == nil || engine.busy)
                          }.frame(height: 150)
                          List(engine.tree, children: \.children) { n in
                              HStack {
                                  Image(systemName: n.isDir ? "folder" : "doc")
                                  Text(n.name)
                                  Spacer()
                                  if !n.isDir { Text(ByteCountFormatter.string(fromByteCount: Int64(n.size), countStyle: .file)).foregroundStyle(.secondary).font(.caption) }
                              }
                          }
                      }.navigationTitle("List")
                  }
              }
          }

          struct RewriteView: View {
              @EnvironmentObject var engine: XisoEngine
              @State private var iso: URL?
              @State private var dest: URL?
              @State private var del = false
              var body: some View {
                  NavigationStack {
                      Form {
                          PickRow(label: "ISO", types: [.data], url: $iso)
                          PickRow(label: "Output folder (optional)", types: [.folder], url: $dest)
                          Toggle("Delete original after rewrite", isOn: $del)
                          Button("Rewrite") { if let i = iso { engine.rewrite(iso: i, dest: dest, deleteOld: del) } }
                              .disabled(iso == nil || engine.busy)
                      }.navigationTitle("Rewrite")
                  }
              }
          }

          struct GodView: View {
              @EnvironmentObject var engine: XisoEngine
              @State private var iso: URL?
              @State private var dest: URL?
              @State private var trim = true
              var body: some View {
                  NavigationStack {
                      Form {
                          PickRow(label: "ISO", types: [.data], url: $iso)
                          PickRow(label: "Output folder", types: [.folder], url: $dest)
                          Toggle("Trim unused space", isOn: $trim)
                          Text("Creates a Games on Demand package (TitleID/00007000/…) from an Xbox 360 ISO. Needs free space roughly equal to the ISO.")
                              .font(.footnote).foregroundStyle(.secondary)
                          Button("Convert to GOD") { if let i = iso, let d = dest { engine.toGOD(iso: i, dest: d, trim: trim) } }
                              .disabled(iso == nil || dest == nil || engine.busy)
                      }.navigationTitle("ISO → GOD")
                  }
              }
          }
          XISO_EOF
          mkdir -p Sources/CXiso
          cat > Sources/CXiso/XisoBridge.h <<'XISO_EOF'
          #include "libxiso.h"
          #include "xisogod.h"
          XISO_EOF
          mkdir -p Sources/CXiso
          cat > Sources/CXiso/xisogod.h <<'XISO_EOF'
          #ifndef XISOGOD_H
          #define XISOGOD_H
          #include <stdint.h>
          #include <stdbool.h>
          typedef void (*xgod_log_cb)(const char *msg, void *user);
          typedef void (*xgod_progress_cb)(uint64_t current, uint64_t total, void *user);
          /* 0 = ok, 1 = error (message via log cb), 2 = cancelled */
          int  xgod_convert(const char *iso_path, const char *dest_dir, bool trim_from_end, int threads,
                            xgod_log_cb log, xgod_progress_cb progress, void *user);
          void xgod_cancel(void);
          #endif
          XISO_EOF
          mkdir -p godffi
          cat > godffi/Cargo.toml <<'XISO_EOF'
          [package]
          name = "xisogod"
          version = "0.1.0"
          edition = "2021"

          [lib]
          crate-type = ["staticlib", "rlib"]

          [dependencies]
          iso2god = { path = "../upstream-god" }
          anyhow = "1"
          rayon = "1.10"

          [profile.release]
          opt-level = 3
          lto = true
          strip = true
          XISO_EOF
          mkdir -p godffi/src
          cat > godffi/src/lib.rs <<'XISO_EOF'
          //! C-ABI wrapper around iso2god-rs (Xbox 360 / Xbox ISO -> Games on Demand).
          //! Logic mirrors iso2god's CLI (src/bin/iso2god.rs) so output is identical.
          use std::ffi::{c_char, c_int, c_void, CStr, CString};
          use std::fs::{self, File};
          use std::io::{Seek, SeekFrom, Write};
          use std::path::Path;
          use std::sync::atomic::{AtomicBool, AtomicUsize, Ordering};

          use anyhow::{anyhow, Context, Error};
          use rayon::prelude::*;

          use iso2god::executable::TitleInfo;
          use iso2god::god::ContentType;
          use iso2god::{game_list, god, iso};

          pub type LogCb = extern "C" fn(msg: *const c_char, user: *mut c_void);
          pub type ProgressCb = extern "C" fn(current: u64, total: u64, user: *mut c_void);

          static CANCEL: AtomicBool = AtomicBool::new(false);

          #[derive(Clone, Copy)]
          struct User(*mut c_void);
          unsafe impl Send for User {}
          unsafe impl Sync for User {}

          #[derive(Clone, Copy)]
          struct Sink {
              log: Option<LogCb>,
              progress: Option<ProgressCb>,
              user: User,
          }

          impl Sink {
              fn log(&self, s: &str) {
                  if let Some(cb) = self.log {
                      if let Ok(c) = CString::new(s.replace('\0', " ")) {
                          cb(c.as_ptr(), self.user.0);
                      }
                  }
              }
              fn progress(&self, cur: u64, total: u64) {
                  if let Some(cb) = self.progress {
                      cb(cur, total, self.user.0);
                  }
              }
          }

          /// Request cancellation of a running xgod_convert (from any thread).
          #[no_mangle]
          pub extern "C" fn xgod_cancel() {
              CANCEL.store(true, Ordering::SeqCst);
          }

          /// Convert an ISO to a GOD package inside dest_dir.
          /// Returns 0 = ok, 1 = error (message sent to log callback), 2 = cancelled.
          #[no_mangle]
          pub extern "C" fn xgod_convert(
              iso_path: *const c_char,
              dest_dir: *const c_char,
              trim_from_end: bool,
              threads: c_int,
              log: Option<LogCb>,
              progress: Option<ProgressCb>,
              user: *mut c_void,
          ) -> c_int {
              let sink = Sink { log, progress, user: User(user) };
              if iso_path.is_null() || dest_dir.is_null() {
                  sink.log("invalid arguments");
                  return 1;
              }
              let (iso, dest) = unsafe {
                  (
                      CStr::from_ptr(iso_path).to_string_lossy().into_owned(),
                      CStr::from_ptr(dest_dir).to_string_lossy().into_owned(),
                  )
              };
              CANCEL.store(false, Ordering::SeqCst);

              let n = threads.max(1) as usize;
              let result = rayon::ThreadPoolBuilder::new()
                  .num_threads(n)
                  .build()
                  .map_err(Error::from)
                  .and_then(|pool| pool.install(|| convert(Path::new(&iso), Path::new(&dest), trim_from_end, &sink)));

              match result {
                  Ok(()) => 0,
                  Err(e) => {
                      if CANCEL.load(Ordering::SeqCst) {
                          sink.log("cancelled");
                          2
                      } else {
                          sink.log(&format!("ERROR: {:#}", e));
                          1
                      }
                  }
              }
          }

          fn convert(src: &Path, dest: &Path, trim_from_end: bool, sink: &Sink) -> Result<(), Error> {
              sink.log("reading ISO metadata");

              let source_iso_file = File::open(src).context("error opening source ISO file")?;
              let source_len = fs::metadata(src).context("error reading source ISO file metadata")?.len();
              let mut source_iso = iso::IsoReader::read(source_iso_file).context("error reading source ISO")?;

              let title_info = TitleInfo::from_image(&mut source_iso).context("error reading image executable")?;
              let exe_info = title_info.execution_info;
              let content_type = title_info.content_type;

              let name = game_list::find_title_by_id(exe_info.title_id);
              sink.log(&format!("Title ID: {:08X}", exe_info.title_id));
              sink.log(&format!("Name: {}", name.clone().unwrap_or_else(|| "(unknown)".to_owned())));
              sink.log(match content_type {
                  ContentType::GamesOnDemand => "Type: Xbox 360 (Games on Demand)",
                  ContentType::XboxOriginal => "Type: Original Xbox",
              });

              let data_size = if trim_from_end {
                  source_iso.get_max_used_prefix_size()
              } else {
                  source_len - source_iso.volume_descriptor.root_offset
              };
              let block_count = data_size.div_ceil(god::BLOCK_SIZE);
              let part_count = block_count.div_ceil(god::BLOCKS_PER_PART);
              if part_count == 0 {
                  return Err(anyhow!("ISO contains no data"));
              }

              let file_layout = god::FileLayout::new(dest, &exe_info, content_type);

              sink.log("clearing data directory");
              {
                  let p = file_layout.data_dir_path();
                  if fs::exists(&p)? {
                      fs::remove_dir_all(&p)?;
                  }
                  fs::create_dir_all(&p)?;
              }

              sink.log(&format!("writing {part_count} part file(s)"));
              let done = AtomicUsize::new(0);
              let root_offset = source_iso.volume_descriptor.root_offset;

              (0..part_count).into_par_iter().try_for_each(|part_index| {
                  if CANCEL.load(Ordering::SeqCst) {
                      return Err(anyhow!("cancelled"));
                  }
                  let mut vol = File::open(src)?;
                  vol.seek(SeekFrom::Start(root_offset))?;
                  let part_file = File::options()
                      .write(true)
                      .create(true)
                      .truncate(true)
                      .open(file_layout.part_file_path(part_index))
                      .context("error creating part file")?;
                  god::write_part(vol, part_index, part_file).context("error writing part file")?;
                  let cur = 1 + done.fetch_add(1, Ordering::Relaxed);
                  sink.progress(cur as u64, part_count);
                  sink.log(&format!("part {cur}/{part_count}"));
                  Ok::<_, Error>(())
              })?;

              sink.log("calculating MHT hash chain");
              let mut mht = read_mht(&file_layout, part_count - 1)?;
              for prev in (0..part_count - 1).rev() {
                  let mut prev_mht = read_mht(&file_layout, prev)?;
                  prev_mht.add_hash(&mht.digest());
                  write_mht(&file_layout, prev, &prev_mht)?;
                  mht = prev_mht;
              }

              let last_part_size = fs::metadata(file_layout.part_file_path(part_count - 1))
                  .map(|m| m.len())
                  .context("error reading part file")?;

              sink.log("writing CON header");
              let mut con = god::ConHeaderBuilder::new()
                  .with_execution_info(&exe_info)
                  .with_block_counts(block_count as u32, 0)
                  .with_data_parts_info(
                      part_count as u32,
                      last_part_size + (part_count - 1) * god::BLOCK_SIZE * 0xa290,
                  )
                  .with_content_type(content_type)
                  .with_mht_hash(&mht.digest());
              if let Some(t) = name {
                  con = con.with_game_title(&t);
              }
              let con = con.finalize();

              File::options()
                  .write(true)
                  .create(true)
                  .truncate(true)
                  .open(file_layout.con_header_file_path())
                  .context("cannot open con header file")?
                  .write_all(&con)
                  .context("error writing con header file")?;

              sink.log("done");
              Ok(())
          }

          fn read_mht(fl: &god::FileLayout, idx: u64) -> Result<god::HashList, Error> {
              let mut f = File::options().read(true).open(fl.part_file_path(idx))?;
              god::HashList::read(&mut f)
          }

          fn write_mht(fl: &god::FileLayout, idx: u64, mht: &god::HashList) -> Result<(), Error> {
              let mut f = File::options().write(true).open(fl.part_file_path(idx))?;
              mht.write(&mut f)?;
              Ok(())
          }
          XISO_EOF
      - name: Build GOD converter (Rust, iOS)
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          rustup default stable
          cargo build --release --target aarch64-apple-ios --manifest-path godffi/Cargo.toml
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (no signing)
        run: |
          set -o pipefail
          xcodebuild -project XisoGUI.xcodeproj -scheme XisoGUI \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | tail -n 100
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/XisoGUI.app"
          test -d "$APP" || { echo "ERROR: Xcode app bundle was not produced"; exit 1; }
          test -s "$APP/XisoGUI" || { echo "ERROR: app executable is missing or empty"; exit 1; }
          echo "Built app bundle size:"
          du -sh "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry XisoGUI.ipa Payload
          test "$(stat -f%z XisoGUI.ipa)" -gt 1000000 || { echo "ERROR: packaged IPA is suspiciously small"; ls -l XisoGUI.ipa; exit 1; }
          unzip -l XisoGUI.ipa | head -n 30
      - uses: actions/upload-artifact@v4
        with:
          name: XisoGUI-ipa
          path: XisoGUI.ipa
