name: XISOStudio
options:
  bundleIdPrefix: com.musaibch
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  XISOStudio:
    type: application
    platform: iOS
    sources:
      - path: ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musaibch.xisostudio
        PRODUCT_NAME: XISO Studio
        INFOPLIST_KEY_CFBundleDisplayName: XISO Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
